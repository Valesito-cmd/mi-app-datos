<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión - Asambleas de Dios</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-container img {
            max-width: 180px;
            height: auto;
            border-radius: 8px;
        }

        h2 {
            margin-bottom: 8px;
            color: #2c3e50;
        }

        p.subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #34495e;
            font-size: 14px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #3498db;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #219150;
        }

        button.btn-logout {
            background-color: #e74c3c;
            margin-top: 20px;
        }

        button.btn-logout:hover {
            background-color: #c0392b;
        }

        .hidden {
            display: none;
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-bottom: 15px;
        }

        /* Lista de usuarios registrados */
        .user-list {
            margin-top: 20px;
            border-top: 1px solid #ecf0f1;
            padding-top: 15px;
            text-align: left;
        }

        .user-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-item span {
            color: #2c3e50;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DE INICIO DE SESIÓN -->
    <div id="login-screen" class="card">
        <div class="logo-container">
            <!-- Logotipo incorporado -->
            <img src="logotipo asamblea de Dios.png" alt="Logotipo Asambleas de Dios">
        </div>
        
        <h2>¡Bienvenido!</h2>
        <p class="subtitle">Ingresa tus datos para acceder al sistema</p>
        
        <div id="login-error" class="error-message hidden">Usuario o contraseña incorrectos</div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Tu usuario" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit">Iniciar Sesión</button>
        </form>
        <p style="font-size:12px; color:#95a5a6; margin-top:15px;">
            (Usuario: <b>vale</b> | Clave: <b>1234</b>)
        </p>
    </div>

    <!-- 2. PANEL PRINCIPAL (POST-LOGIN) -->
    <div id="dashboard-screen" class="card hidden">
        <h2 id="welcome-title">Panel de Control</h2>
        <p class="subtitle">Gestión de Usuarios y Accesos</p>

        <!-- Formulario para agregar nuevos usuarios -->
        <form id="add-user-form">
            <h3 style="font-size: 16px; margin-bottom: 12px; color: #2c3e50; text-align: left;">Agregar Nuevo Usuario</h3>
            
            <div class="form-group">
                <label for="new-username">Nuevo Usuario</label>
                <input type="text" id="new-username" placeholder="Ej: juan" required>
            </div>

            <div class="form-group">
                <label for="new-password">Contraseña</label>
                <input type="password" id="new-password" placeholder="••••••••" required>
            </div>

            <button type="submit" style="background-color: #3498db;">Guardar Nuevo Usuario</button>
        </form>

        <!-- Lista de usuarios registrados -->
        <div class="user-list">
            <h3 style="font-size: 15px; margin-bottom: 10px; color: #2c3e50;">Usuarios Registrados:</h3>
            <div id="users-container">
                <!-- Se cargan dinámicamente con JS -->
            </div>
        </div>

        <button class="btn-logout" id="logout-btn">Cerrar Sesión</button>
    </div>

    <script>
        // Base de datos simulada con el usuario administrador por defecto
        const usuariosDB = [
            { usuario: 'vale', clave: '1234' }
        ];

        // Elementos de la interfaz
        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const loginForm = document.getElementById('login-form');
        const addUserForm = document.getElementById('add-user-form');
        const loginError = document.getElementById('login-error');
        const usersContainer = document.getElementById('users-container');
        const logoutBtn = document.getElementById('logout-btn');
        const welcomeTitle = document.getElementById('welcome-title');

        let usuarioActual = null;

        // Función para actualizar la lista visual de usuarios
        function renderizarUsuarios() {
            usersContainer.innerHTML = '';
            usuariosDB.forEach(user => {
                const userDiv = document.createElement('div');
                userDiv.className = 'user-item';
                userDiv.innerHTML = `<span>👤 ${user.usuario}</span> <small style="color: #7f8c8d;">Activo</small>`;
                usersContainer.appendChild(userDiv);
            });
        }

        // Evento: Iniciar Sesión
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const userInput = document.getElementById('username').value;
            const passInput = document.getElementById('password').value;

            // Verificación
            const usuarioValido = usuariosDB.find(u => u.usuario === userInput && u.clave === passInput);

            if (usuarioValido) {
                usuarioActual = usuarioValido.usuario;
                loginError.classList.add('hidden');
                loginScreen.classList.add('hidden');
                dashboardScreen.classList.remove('hidden');
                welcomeTitle.textContent = `¡Hola, ${usuarioActual}!`;
                renderizarUsuarios();
            } else {
                loginError.classList.add('hidden');
            }
        });

        // Evento: Agregar Nuevo Usuario
        addUserForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newUsername = document.getElementById('new-username').value;
            const newPassword = document.getElementById('new-password').value;

            // Validar que no exista
            if (usuariosDB.some(u => u.usuario === newUsername)) {
                alert('El usuario ya existe');
                return;
            }

            // Guardar usuario
            usuariosDB.push({ usuario: newUsername, clave: newPassword });
            renderizarUsuarios();

            // Limpiar campos
            document.getElementById('new-username').value = '';
            document.getElementById('new-password').value = '';
            alert(`Usuario "${newUsername}" creado con éxito.`);
        });

        // Evento: Cerrar Sesión
        logoutBtn.addEventListener('click', () => {
            usuarioActual = null;
            dashboardScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        });
    </script>
</body>
</html>
